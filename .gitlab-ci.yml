# Fraxinus GitLab CI/CD configuration file

default:
  #image: olevs/custusx-build-ubuntu2004 #Dockerhub
  image: gitlab.sintef.no:5050/custusx/custusx/custusx-build-ubuntu2004

stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    # - export # For listing all gitlab variables
    - echo "Compiling the code..."
    - cd $CI_PROJECT_DIR
    - ./script/cxJenkinsMasterBuildScript.py --create_package --developer_doc --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    #TODO: For only building open source
    #- ./script/cxOpenSourceMasterBuildScript.py --create_package --developer_doc --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    - echo "Compile complete."
  artifacts:
    paths:
      - package_artefacts/Fraxinus*.tar.gz
      - package_artefacts/html_pure/
      - package_artefacts/html_dev/

test-job:   # This job runs the Unit + Integration tests
  stage: test    # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Running unit tests... "
    - xvfb-run ./script/cxJenkinsMasterBuildScript.py --test_package --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    #Open source:
    #- xvfb-run ./script/cxOpenSourceMasterBuildScript.py --test_package --main_branch $CI_COMMIT_BRANCH --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    - cp -r /builds/custusx/CustusX/test_results ${CI_PROJECT_DIR}/test_results
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - test_results/*junit.xml
    reports:
      junit: test_results/*junit.xml

.deploy:
  stage: deploy
  environment: production
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
  script:
  - echo "Deploying application..."
  - cd $CI_PROJECT_DIR/package_artefacts
  - INSTALLER_FILE=$(find Fraxinus*.tar.gz)
  - 'curl
     --header "JOB-TOKEN: $CI_JOB_TOKEN"
     --upload-file $INSTALLER_FILE
     "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Fraxinus/$VERSION/$INSTALLER_FILE"'

deploy-commmit:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH # Only run for changes to the default (develop) branch
      when: never
    - if: '$CI_COMMIT_TAG == null' # Run for all commits, except tags

deploy-tag:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG != null' # Run if a tag is present (= release or release candidate)


pages:
  stage: deploy
  environment: production
  script:
    - cd $CI_PROJECT_DIR
    - mv package_artefacts/html_pure/ public/user_doc/
    - mv package_artefacts/html_dev/ public/developer_doc/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run for all changes to the default (develop) branch only
