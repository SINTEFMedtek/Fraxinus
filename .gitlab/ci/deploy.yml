# Deploy stage jobs

.deploy:
  stage: deploy
  extends: .build-variables
  environment: production
  variables:
    VERSION: ${CI_COMMIT_SHORT_SHA}
  script:
    - echo "Deploying application..."
    - |
      for OS in Ubuntu2004 Ubuntu2204 Ubuntu2404; do
        DIR="$CI_PROJECT_DIR/$OS/package_artefacts"
        if [ ! -d "$DIR" ]; then
          echo "WARNING: no artifacts for $OS, skipping."
          continue
        fi
        INSTALLER_FILE=$(find "$DIR" -maxdepth 1 -name 'Fraxinus*.tar.gz' -printf '%f\n' | head -1)
        if [ -z "$INSTALLER_FILE" ]; then
          echo "WARNING: no Fraxinus*.tar.gz in $DIR, skipping."
          continue
        fi
        # Upload under the original CPack filename
        curl \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$DIR/$INSTALLER_FILE" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Fraxinus/$VERSION/$OS/$INSTALLER_FILE"
        # Also upload under a predictable alias so installFraxinus.sh can construct the URL
        curl \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$DIR/$INSTALLER_FILE" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Fraxinus/$VERSION/$OS/Fraxinus-${OS}.tar.gz"
      done
    # Upload install script with version baked in so users get a single-file installer
    - sed "s/^FRAXINUS_VERSION=.*/FRAXINUS_VERSION=\"${VERSION}\"/" install/installFraxinus.sh > /tmp/installFraxinus.sh
    - |
      curl \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file /tmp/installFraxinus.sh \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Fraxinus/$VERSION/installFraxinus.sh"

deploy-commit:
  extends: .deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH # Only run for changes to the default (develop) branch
      when: never
    - if: '$CI_COMMIT_TAG == null' # Run for all commits, except tags
      when: never # Don't deploy for develop branch either

deploy-tag:
  extends: .deploy
  variables:
    VERSION: ${CI_COMMIT_TAG}
  rules:
    - if: '$CI_COMMIT_TAG != null' # Run if a tag is present (= release or release candidate)

create-release:
  stage: deploy
  image: alpine:latest
  needs: ["deploy-tag"]
  rules:
    - if: '$CI_COMMIT_TAG != null'
  script:
    - apk add --no-cache curl jq
    - |
      set -e
      # Release-notes files are committed per release cycle (e.g. v26.08), not per
      # rc tag -- strip a trailing -rcN so v26.08-rc1, v26.08-rc2, ... and the final
      # v26.08 tag all resolve to the same doc/release_notes/release_notes_v26.08.md file.
      BASE_VERSION=$(echo "$CI_COMMIT_TAG" | sed -E 's/-rc[0-9]+$//')
      NOTES_MD="doc/release_notes/release_notes_${BASE_VERSION}.md"
      if [ ! -f "$NOTES_MD" ]; then
        echo "WARNING: $NOTES_MD not found for tag ${CI_COMMIT_TAG}. Skipping release creation."
        exit 0
      fi

      INSTALL_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/Fraxinus/${CI_COMMIT_TAG}/installFraxinus.sh"
      # filepath enables the permalink/latest/downloads/installFraxinus.sh shortcut,
      # so the README install command doesn't need updating on every release.
      LINKS=$(jq -n --arg url "$INSTALL_URL" \
        '[{name: "Fraxinus installer script (all Ubuntu versions)", url: $url, link_type: "package", filepath: "/installFraxinus.sh"}]')

      DESCRIPTION=$(jq -Rs . < "$NOTES_MD")

      curl --fail-with-body --request POST --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$(jq -n --arg tag "$CI_COMMIT_TAG" --argjson links "$LINKS" --argjson desc "$DESCRIPTION" \
          '{tag_name: $tag, name: $tag, description: $desc, assets: {links: $links}}')" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"

pages:
  stage: deploy
  extends: .build-variables
  environment: production
  variables:
    OS: Ubuntu2004
  script:
    - mv $OS/package_artefacts/html_pure/ public/user_doc/
    - mv $OS/package_artefacts/html_dev/ public/developer_doc/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run for all changes to the default (develop) branch only
