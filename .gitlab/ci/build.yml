# Build stage templates and jobs

.set-cx-commit:
  script:
    - if [ $CI_COMMIT_TAG ]; then CX_COMMIT=$CI_COMMIT_TAG; else CX_COMMIT=${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}; fi

.build-variables:
  variables:
    OS: OS
    BASE_DIR: /builds/Fraxinus/$OS
    GIT_CLONE_PATH: $BASE_DIR/FX/FX #Changes CI_PROJECT_DIR
    BUILD_DIR: $BASE_DIR/CX/build_Release_FX
    CX_SOURCE_PATH: $BASE_DIR/CX/CX
    BUILD_IGSTK: "false"
    # URL-encoded path to the CustusX GitLab project. Override this variable
    # (e.g. in project CI settings) if CustusX is ever renamed or moved.
    CX_REGISTRY_PROJECT: "custusx%2FCustusX"

.create-installer:
  script:
    - cd $BUILD_DIR
    # Remove old installer
    - rm -f Fraxinus*.tar.gz
    - cpack
    # The file Fraxinus*.tar.gz should now be in CX/build_Release, and html_pure and html_dev in CX/build_Release/doc
    - cd $CI_PROJECT_DIR
    - mkdir -p $OS/package_artefacts
    - cp -R $BUILD_DIR/Fraxinus*.tar.gz $OS/package_artefacts/
    - cp -R $BUILD_DIR/doc/html_pure $OS/package_artefacts/html_pure/
    - cp -R $BUILD_DIR/doc/html_dev $OS/package_artefacts/html_dev/
    - echo "Compile complete."
  artifacts:
    paths:
      - $OS/package_artefacts/Fraxinus*.tar.gz
      - $OS/package_artefacts/html_pure/
      - $OS/package_artefacts/html_dev/

.reuse-build:
  extends:
    - .build-variables
    - .create-installer
  before_script:
  - ls $BASE_DIR
  # Manual escape hatch: set FORCE_CLEAN_APP_BUILD=true (CI/CD > Run pipeline variables)
  # to wipe this runner's incrementally-reused build tree and force a from-scratch rebuild.
  # Does not touch the external-libs cache/sentinel below. Useful when a runner's
  # persistent build tree is suspected stale (e.g. didn't pick up a downstream fix).
  - |
    if [ "$FORCE_CLEAN_APP_BUILD" = "true" ]; then
      echo "FORCE_CLEAN_APP_BUILD set - wiping $BUILD_DIR for a clean rebuild"
      rm -rf $BUILD_DIR
    fi
  - !reference [.set-cx-commit, script]
  # Set IGSTK variant variables. Must come first so cleanup below is conditional.
  # No IGSTK_FLAG: PrivateControlData auto-detects via /etc/os-release (Ubuntu 20/22 → on,
  # Ubuntu 24 → off), which is always correct for the Docker images in use.
  # add_boolean_inverter() generates --skip_igstk when the default is True (Ubuntu 20/22)
  # and --igstk when the default is False (Ubuntu 24), so there is no single flag that
  # works across both platforms — relying on auto-detection is simpler and safe.
  - |
    if [ "${BUILD_IGSTK}" = "true" ]; then
      IGSTK_LIBS="eigen VTK ITK IGSTK OpenCV OpenIGTLink CTK OpenIGTLinkIO OpenCLUtilityLibrary QHttpServer"
      # CustusX's own per-library CI cache (CustusX#50) keys packages by this
      # exact variant string ("plain"/"igstk").
      CX_IGSTK_VARIANT="igstk"
      CX_IGSTK_FLAG="--igstk"
    else
      IGSTK_LIBS="eigen VTK ITK OpenCV OpenIGTLink CTK OpenIGTLinkIO OpenCLUtilityLibrary QHttpServer"
      CX_IGSTK_VARIANT="plain"
      CX_IGSTK_FLAG=""
      rm -rf $BASE_DIR/IGSTK  # not used in this build; remove stale dir from old agents
    fi
  - rm -rf $BUILD_DIR  # always clean the app build dir before rebuilding
  - IMAGE_TAG=$(echo $CI_JOB_IMAGE | sed 's|.*/||' | tr ':' '_')
  # Per-library cache check, mirroring CustusX's own build.yml (CustusX#50): each
  # library is tried independently instead of one combined package (the combined
  # "custusx-external-libs" package CX used to publish no longer exists -- CX
  # moved to per-library "custusx-external-lib" packages), so an unrelated
  # library's version bump doesn't force every other library to be re-downloaded
  # or rebuilt too. Checked against two registries in order: (1) CustusX's own
  # custusx-external-lib registry -- FX builds the exact same pinned libraries
  # CX does, so reuse whatever CX has already built+published for this
  # OS/image/variant; (2) this project's own fraxinus-external-lib registry,
  # for whatever CX hasn't published yet (e.g. FX's CX checkout is ahead of
  # CX's last published packages). Both use the same version key (a hash of the
  # resolved component class, via CX's own cxLibVersionHash.py), since it
  # identifies the same library content regardless of which project hosts it.
  # Requires a CX checkout to already exist locally (true on any warm/persistent
  # runner); on a cold BASE_DIR (first-ever run) there's nothing to hash against
  # yet, so every library falls through to a from-scratch build below, same as
  # before.
  - |
    MISSING_LIBS=""
    for LIB in $IGSTK_LIBS; do
      SENTINEL="$BASE_DIR/.lib_version_${LIB}"
      LIB_READY=false
      if [ -f "$CX_SOURCE_PATH/install/cx/build/cxLibVersionHash.py" ]; then
        LIB_HASH=$(python3 "$CX_SOURCE_PATH/install/cx/build/cxLibVersionHash.py" "$LIB" $CX_IGSTK_FLAG)
        LIB_VERSION="${LIB}-${OS}-${CX_IGSTK_VARIANT}-${IMAGE_TAG}-${LIB_HASH}"
        if [ -f "$SENTINEL" ] && [ "$(cat "$SENTINEL")" = "$LIB_VERSION" ]; then
          echo "  $LIB: local cache hit ($LIB_VERSION)."
          LIB_READY=true
        fi
        if [ "$LIB_READY" = "false" ]; then
          CX_LIB_FILE="cx-external-lib-${LIB}-${OS}-${CX_IGSTK_VARIANT}.tar.gz"
          CX_LIB_URL="${CI_API_V4_URL}/projects/${CX_REGISTRY_PROJECT}/packages/generic/custusx-external-lib/${LIB_VERSION}/${CX_LIB_FILE}"
          echo "  $LIB: checking CX registry for ${LIB_VERSION}..."
          HTTP_CODE=$(curl -s -o /tmp/$CX_LIB_FILE -w "%{http_code}" --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CX_LIB_URL")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "  $LIB: downloaded from CX registry."
            ( cd $BASE_DIR && rm -rf $LIB && tar -xzf /tmp/$CX_LIB_FILE )
            echo "$LIB_VERSION" > "$SENTINEL"
            LIB_READY=true
          fi
        fi
        if [ "$LIB_READY" = "false" ]; then
          OWN_LIB_FILE="fx-external-lib-${LIB}-${OS}-${CX_IGSTK_VARIANT}.tar.gz"
          OWN_LIB_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/fraxinus-external-lib/${LIB_VERSION}/${OWN_LIB_FILE}"
          echo "  $LIB: checking own registry for ${LIB_VERSION}..."
          HTTP_CODE=$(curl -s -o /tmp/$OWN_LIB_FILE -w "%{http_code}" --header "JOB-TOKEN: $CI_JOB_TOKEN" "$OWN_LIB_URL")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "  $LIB: downloaded from own registry."
            ( cd $BASE_DIR && rm -rf $LIB && tar -xzf /tmp/$OWN_LIB_FILE )
            echo "$LIB_VERSION" > "$SENTINEL"
            LIB_READY=true
          fi
        fi
      fi
      if [ "$LIB_READY" = "false" ]; then
        MISSING_LIBS="$MISSING_LIBS $LIB"
      fi
    done
    echo "Libraries to build from source:$MISSING_LIBS"
  - |
    if [ -n "$MISSING_LIBS" ]; then
      echo "Building missing external libs from source:$MISSING_LIBS"
      for LIB in $MISSING_LIBS; do
        rm -rf $BASE_DIR/$LIB
      done
      eval ./script/cxFraxinusInstaller.py -s --full -j 4 -t Release \
        --main_branch $CX_COMMIT \
        --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx \
        components $MISSING_LIBS
      # Guarded the same way as the lookup above: on a cold BASE_DIR (first-ever
      # run), building just these external-lib components never checks out
      # CustusX, so cxLibVersionHash.py still won't exist here -- skip caching
      # for now rather than hard-failing the job right after the expensive
      # from-scratch build; the next run (once CustusX is checked out below)
      # will be able to cache normally.
      if [ -f "$CX_SOURCE_PATH/install/cx/build/cxLibVersionHash.py" ]; then
        echo "Uploading newly-built libs to own Package Registry for future runs..."
        for LIB in $MISSING_LIBS; do
          LIB_HASH=$(python3 "$CX_SOURCE_PATH/install/cx/build/cxLibVersionHash.py" "$LIB" $CX_IGSTK_FLAG)
          LIB_VERSION="${LIB}-${OS}-${CX_IGSTK_VARIANT}-${IMAGE_TAG}-${LIB_HASH}"
          LIB_FILE="fx-external-lib-${LIB}-${OS}-${CX_IGSTK_VARIANT}.tar.gz"
          LIB_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/fraxinus-external-lib/${LIB_VERSION}/${LIB_FILE}"
          ( cd $BASE_DIR && tar -czf /tmp/$LIB_FILE --exclude='*/CMakeFiles' --exclude='*/.git' $LIB )
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file /tmp/$LIB_FILE "$LIB_URL" || true
          echo "$LIB_VERSION" > "$BASE_DIR/.lib_version_${LIB}"
        done
      else
        echo "CustusX not yet checked out locally -- skipping lib caching this run."
      fi
    fi
  - |
    echo "Building Fraxinus..."
    eval ./script/cxFraxinusInstaller.py -s --full -t Release --user_doc --developer_doc \
      --main_branch $CX_COMMIT \
      --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx \
      --build_folder CustusX=build_Release_FX \
      components CustusX Fraxinus

# Shared by all three platform build jobs below so only one builds at a time
# (they'd otherwise all be eligible to run concurrently, since they're in the
# same stage and don't depend on each other) -- reduces concurrent runner load
# without needing a separate stage per platform. Which platform goes first is
# not guaranteed, just that they never overlap.
.serialize-platform-build:
  resource_group: fx-platform-build

build-ubuntu20:
  extends:
    - .reuse-build
    - .serialize-platform-build
  stage: build
  image: $IMAGE_UBUNTU2004
  variables:
    OS: Ubuntu2004
    BUILD_IGSTK: "true"
    BASE_DIR: /builds/Ubuntu2004igstk

build-ubuntu22:
  extends:
    - .reuse-build
    - .serialize-platform-build
  stage: build
  image: $IMAGE_UBUNTU2204
  variables:
    OS: Ubuntu2204
    BUILD_IGSTK: "true"
    BASE_DIR: /builds/Ubuntu2204igstk

build-ubuntu24:
  extends:
    - .reuse-build
    - .serialize-platform-build
  stage: build
  image: $IMAGE_UBUNTU2404
  variables:
    OS: Ubuntu2404
    BASE_DIR: /builds/Ubuntu2404

# Keeps only the KEEP_VERSIONS newest packages per library/OS/variant group in
# the fraxinus-external-lib registry -- our own fallback for whatever CX's
# custusx-external-lib registry doesn't have yet (see build.yml's per-library
# lookup). Deletes a whole group outright, regardless of KEEP_VERSIONS, if its
# prefix no longer matches a live job's current Docker image tag/IGSTK
# variant (CustusX#50's identical cleanup-old-external-libs explains why that
# extra check exists: a plain keep-N-per-group rotation never notices a
# permanently abandoned prefix, e.g. after a Docker image bump). Run on a
# schedule (e.g. weekly) to prevent unbounded accumulation. Also available as
# a manual job.
cleanup-old-external-libs:
  stage: build
  image: $IMAGE_UBUNTU2404
  variables:
    KEEP_VERSIONS: "1"
  script:
    - |
      python3 << 'PYEOF'
      import json, os, sys
      import urllib.request, urllib.error
      from collections import defaultdict

      api   = os.environ['CI_API_V4_URL']
      proj  = os.environ['CI_PROJECT_ID']
      token = os.environ['CI_JOB_TOKEN']
      keep  = int(os.environ.get('KEEP_VERSIONS', '1'))
      pkg_name = 'fraxinus-external-lib'

      def sanitize_image_tag(image):
          return image.rsplit('/', 1)[-1].replace(':', '_')

      valid_image_tags = {
          sanitize_image_tag(os.environ['IMAGE_UBUNTU2004']),
          sanitize_image_tag(os.environ['IMAGE_UBUNTU2204']),
          sanitize_image_tag(os.environ['IMAGE_UBUNTU2404']),
      }

      def is_current_format(prefix):
          for tag in valid_image_tags:
              suffix = '-' + tag
              if prefix.endswith(suffix) and prefix[:-len(suffix)].endswith(('-plain', '-igstk')):
                  return True
          return False

      def api_request(path, method='GET'):
          req = urllib.request.Request(
              f'{api}/projects/{proj}/{path}',
              headers={'JOB-TOKEN': token},
              method=method)
          with urllib.request.urlopen(req) as r:
              body = r.read()
              return json.loads(body) if body else None

      packages, page = [], 1
      while True:
          batch = api_request(f'packages?package_name={pkg_name}&per_page=100&page={page}')
          if not batch:
              break
          packages.extend(batch)
          if len(batch) < 100:
              break
          page += 1
      print(f'Found {len(packages)} package(s) named "{pkg_name}"')

      groups = defaultdict(list)
      for p in packages:
          prefix = p['version'].rsplit('-', 1)[0]
          groups[prefix].append(p)

      deleted = 0
      for prefix, pkgs in sorted(groups.items()):
          pkgs.sort(key=lambda p: p['created_at'], reverse=True)
          if is_current_format(prefix):
              kept = [p['version'] for p in pkgs[:keep]]
              print(f'{prefix}: keeping {kept}')
              to_remove = pkgs[keep:]
          else:
              print(f'{prefix}: stale format/image tag, deleting all {len(pkgs)} version(s)')
              to_remove = pkgs
          for old in to_remove:
              try:
                  api_request(f'packages/{old["id"]}', method='DELETE')
                  print(f'  Deleted {old["version"]} (id={old["id"]})')
                  deleted += 1
              except urllib.error.HTTPError as e:
                  print(f'  WARNING: failed to delete {old["version"]}: {e}', file=sys.stderr)

      print(f'Done. Deleted {deleted} old package(s).')
      PYEOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
      allow_failure: true
