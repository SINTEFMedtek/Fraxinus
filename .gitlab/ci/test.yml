# Test stage templates and jobs

.old-test-job:   # This job runs the Unit + Integration tests, unused legacy template
  script:
    - echo "Running unit tests... "
    - !reference [.set-cx-commit, script]
    - xvfb-run ./script/cxJenkinsMasterBuildScript.py --test_package --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    #Open source:
    #- xvfb-run ./script/cxOpenSourceMasterBuildScript.py --test_package --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    - cp -r /builds/custusx/CustusX/test_results ${CI_PROJECT_DIR}/test_results
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - test_results/*junit.xml
    reports:
      junit: test_results/*junit.xml

.test-job:   # This job runs the Unit + Integration tests
  # needs: (set per-platform job below) makes each test job start as soon as
  # its matching platform's build job completes, without waiting for the
  # whole build stage (i.e. all three platform builds) to finish first.
  extends: .build-variables
  script:
    - echo "Running unit tests... "
    - ls $BASE_DIR
    - rm -rf $BASE_DIR/Installed # Clean previous installation
    - !reference [.set-cx-commit, script]
    # Checkout CX repo if missing, else only delete package_artefacts folder.
    # Fall back to develop if CX has no branch matching the Fraxinus branch name.
    - |
      if [ -d "$CX_SOURCE_PATH" ]; then
        rm -rf $CX_SOURCE_PATH/package_artefacts
      else
        git clone -b $CX_COMMIT https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx/CustusX.git $CX_SOURCE_PATH 2>/dev/null \
          || git clone -b develop https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx/CustusX.git $CX_SOURCE_PATH
      fi
    # Copy installer into CX repository
    - mkdir -p $CX_SOURCE_PATH/package_artefacts
    - cp -R $OS/package_artefacts/Fraxinus*.tar.gz $CX_SOURCE_PATH/package_artefacts/
    - ls $CX_SOURCE_PATH/package_artefacts  2> /dev/null
    # CustusX#46: capture the test command's exit code instead of letting a
    # nonzero exit (e.g. 42 for failing-but-not-crashed Catch tests) abort the
    # script here - that would skip the copy below and leave the junit report
    # (and therefore the GitLab Tests tab / artifact) empty for every failing
    # run. Re-raise it at the end so allow_failure.exit_codes still applies.
    - xvfb-run ./script/cxJenkinsMasterBuildScript.py --test_package --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx; TEST_EXIT_CODE=$?
    # CustusX#46: copy to $GIT_CLONE_PATH, not $CI_PROJECT_DIR - artifact
    # paths are resolved by the runner relative to GIT_CLONE_PATH (.build-
    # variables overrides it), and depending on CI_PROJECT_DIR to have been
    # re-derived to match it exactly is one indirection too many; using our
    # own already-set variable removes the ambiguity entirely. Also: on
    # these persistent runners, the destination test_results can already
    # exist from a previous run - `cp -R SRC DEST/` then copies SRC *inside*
    # an existing DEST (test_results/test_results/*junit.xml) instead of
    # merging into it, which is why the artifact glob below found nothing on
    # the first real run of this fix. `SRC/.` copies SRC's contents into
    # DEST regardless of whether DEST already existed.
    - mkdir -p ${GIT_CLONE_PATH}/test_results && cp -R $CX_SOURCE_PATH/test_results/. ${GIT_CLONE_PATH}/test_results/
    - exit $TEST_EXIT_CODE
  # Exit code 42 (cx.build.cxTestRunner.CATCH_TEST_FAILURE_EXIT_CODE) means the
  # Catch tests ran to completion but some assertions failed/crashed - show the
  # job as an orange "warning" in the pipeline instead of solid green, without
  # blocking the pipeline/merge. Any other non-zero exit is a real build/install
  # failure and still hard-fails the job as before. (CustusX#46; ported from CX/CX.)
  allow_failure:
    exit_codes: 42
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - test_results/*junit.xml
    reports:
      junit: test_results/*junit.xml

test-ubuntu20:
  extends: .test-job
  stage: test
  needs: ["build-ubuntu20"]
  image: $IMAGE_UBUNTU2004
  variables:
    OS: Ubuntu2004

test-ubuntu22:
  extends: .test-job
  stage: test
  needs: ["build-ubuntu22"]
  image: $IMAGE_UBUNTU2204
  variables:
    OS: Ubuntu2204

test-ubuntu24:
  extends: .test-job
  stage: test
  needs: ["build-ubuntu24"]
  image: $IMAGE_UBUNTU2404
  variables:
    OS: Ubuntu2404
