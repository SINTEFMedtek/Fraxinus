# Test stage templates and jobs

.old-test-job:   # This job runs the Unit + Integration tests, unused legacy template
  script:
    - echo "Running unit tests... "
    - !reference [.set-cx-commit, script]
    - xvfb-run ./script/cxJenkinsMasterBuildScript.py --test_package --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    #Open source:
    #- xvfb-run ./script/cxOpenSourceMasterBuildScript.py --test_package --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    - cp -r /builds/custusx/CustusX/test_results ${CI_PROJECT_DIR}/test_results
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - test_results/*junit.xml
    reports:
      junit: test_results/*junit.xml

.test-job:   # This job runs the Unit + Integration tests
  # stage is set per-platform job below, to serialize platform builds; it only
  # starts when the matching platform's build job completes successfully.
  extends: .build-variables
  script:
    - echo "Running unit tests... "
    - ls $BASE_DIR
    - rm -rf $BASE_DIR/Installed # Clean previous installation
    - !reference [.set-cx-commit, script]
    # Checkout CX repo if missing, else only delete package_artefacts folder.
    # Fall back to develop if CX has no branch matching the Fraxinus branch name.
    - |
      if [ -d "$CX_SOURCE_PATH" ]; then
        rm -rf $CX_SOURCE_PATH/package_artefacts
      else
        git clone -b $CX_COMMIT https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx/CustusX.git $CX_SOURCE_PATH 2>/dev/null \
          || git clone -b develop https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx/CustusX.git $CX_SOURCE_PATH
      fi
    # Copy installer into CX repository
    - mkdir -p $CX_SOURCE_PATH/package_artefacts
    - cp -R $OS/package_artefacts/Fraxinus*.tar.gz $CX_SOURCE_PATH/package_artefacts/
    - ls $CX_SOURCE_PATH/package_artefacts  2> /dev/null
    - xvfb-run ./script/cxJenkinsMasterBuildScript.py --test_package --main_branch $CX_COMMIT --gitrepo_main_site_base https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.sintef.no/custusx
    - cp -R $CX_SOURCE_PATH/test_results ${CI_PROJECT_DIR}/test_results/
  artifacts:
    when: always
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    paths:
      - test_results/*junit.xml
    reports:
      junit: test_results/*junit.xml

test-ubuntu20:
  extends: .test-job
  stage: test-20
  needs: ["build-ubuntu20"]
  image: $IMAGE_UBUNTU2004
  variables:
    OS: Ubuntu2004

test-ubuntu22:
  extends: .test-job
  stage: test-22
  needs: ["build-ubuntu22"]
  image: $IMAGE_UBUNTU2204
  variables:
    OS: Ubuntu2204

test-ubuntu24:
  extends: .test-job
  stage: test-24
  needs: ["build-ubuntu24"]
  image: $IMAGE_UBUNTU2404
  variables:
    OS: Ubuntu2404
